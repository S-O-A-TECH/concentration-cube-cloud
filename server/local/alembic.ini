[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# NOTE: keep this file ASCII-only (configparser reads it with the locale
# encoding = cp949 on Windows). The DB URL is injected by migrations/env.py
# from app.config (.env); the value below is a placeholder.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
