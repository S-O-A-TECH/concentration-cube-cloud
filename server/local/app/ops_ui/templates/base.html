<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>운영 콘솔 — concentration-cube</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#1a2b4a; --ink:#222; --line:#dcd6cc; --bg:#f7f4ef;
          --focus:#4caf50; --off:#ff9800; --blank:#ffd54f; --invalid:#e0e0e0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--navy); color:#fff; padding:10px 20px; display:flex; align-items:center; gap:18px; }
  header .brand { font-weight:700; }
  header .brand small { opacity:.7; font-weight:400; margin-left:6px; }
  nav a { color:#cdd8ec; text-decoration:none; margin-right:12px; font-size:14px; }
  nav a:hover { color:#fff; }
  main { max-width:1080px; margin:24px auto; padding:0 16px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin-top:24px; }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13px; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { background:#efe9df; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:150px; }
  .card b { display:block; font-size:22px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eee; }
  .ok { background:#dcf1dd; } .warn { background:#ffe3c2; } .err { background:#ffd4d4; }
  button, .btn { padding:4px 10px; font-size:13px; cursor:pointer; }
  input, select { padding:4px 6px; font-size:13px; }
  .timeline { display:flex; height:26px; border:1px solid var(--line); border-radius:4px; overflow:hidden; position:relative; background:var(--invalid); }
  .timeline i { display:block; height:100%; position:absolute; top:0; }
  .st-focus { background:var(--focus); } .st-off_task { background:var(--off); }
  .st-blank_stare { background:var(--blank); } .st-invalid { background:var(--invalid); }
  .legend span { font-size:12px; margin-right:12px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:4px; }
  .comp { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px; }
  .comp .bar { flex:1; height:10px; background:#eee; border-radius:5px; overflow:hidden; }
  .comp .bar i { display:block; height:100%; background:var(--navy); }
  .coach { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:8px 0; font-size:14px; }
  .note { color:#777; font-size:12px; }
  pre.tok { background:#20301f; color:#c7f3c9; padding:8px; border-radius:6px; user-select:all; }
</style>
</head>
<body>
<header>
  <span class="brand">운영 콘솔<small>concentration-cube main server</small></span>
  <nav>
    <a href="/ops/dashboard">대시보드</a>
    <a href="/ops/users">계정</a>
    <a href="/ops/devices">기기</a>
    <a href="/ops/sessions">세션</a>
    <a href="/ops/versions">버전</a>
    <a href="/ops/relax_voice">수면세션</a>
    <a href="/ops/audit">감사</a>
  </nav>
  <span style="flex:1"></span>
  <button onclick="fetch('/v1/ops/logout',{method:'POST'}).then(()=>location.href='/ops/login')">로그아웃</button>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
