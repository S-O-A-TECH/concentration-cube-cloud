# concentration-cube 운영 서버 — 로컬 = 클라우드 동일 Compose (SPEC-00 §1)
# 로컬:   docker compose up -d              (api,worker,postgres,redis)
# 클라우드: docker compose --profile cloud up -d   (+caddy — S7 에서 작성)
name: concentration-cube-server

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cube}:${POSTGRES_PASSWORD:-cube_dev_pw}@postgres:5432/${POSTGRES_DB:-cube}
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /data/storage
  APP_VERSION: ${APP_VERSION:-dev}
  OPS_ADMIN_ID: ${OPS_ADMIN_ID:-admin}
  OPS_ADMIN_PW: ${OPS_ADMIN_PW:-change-me}
  EVOLUTION_TOKEN: ${EVOLUTION_TOKEN:-change-me}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  LLM_REPORT_ENABLED: ${LLM_REPORT_ENABLED:-false}
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cube_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-cube}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # 호스트 직접 실행 모드(README ②)용 — 외부 비노출
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cube} -d ${POSTGRES_DB:-cube}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"   # 호스트 직접 실행 모드용 — 6379 는 이 PC 의 WSL 내부 redis 가 점유 중
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    # 기동 시 마이그레이션 자동 적용 + 멱등 시드 (S1 구현계획 §1.2)
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8100"]
    environment: *app-env
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:8100:8100"   # 웹캠 프로토(8123)·live-evolution(8200)과 분리
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build: .
    restart: unless-stopped
    command: ["rq", "worker", "scoring", "--url", "redis://redis:6379/0"]
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: &log-rotate
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 정리 잡 주기 실행 (S7 §1.3) — open 24h 초과 세션 failed 처리 등
  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.maintenance", "--loop", "3600"]
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    logging: *log-rotate

  # S7(클라우드 이전)에서 Caddyfile·443/80 포트·도메인 구성 작성 — 자리만 예약
  caddy:
    image: caddy:2
    profiles: ["cloud"]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
