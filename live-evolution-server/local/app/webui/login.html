<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Live Evolution</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129516;</text></svg>">
</head>
<body>
<main>
  <div class="login-wrap">
    <div class="card" style="text-align:center">
      <h1 style="color:var(--live)">🧬 Live Evolution</h1>
      <p class="sub">concentration-cube 임상 검증 콘솔 (127.0.0.1 전용)</p>
      <form id="f" style="margin-top:16px;text-align:left">
        <label class="fld">아이디</label>
        <input type="text" id="id" autocomplete="username" autofocus>
        <label class="fld">비밀번호</label>
        <input type="password" id="pw" autocomplete="current-password">
        <div id="msg" class="sub" style="color:var(--bad);min-height:22px;margin-top:8px"></div>
        <button style="width:100%">로그인</button>
      </form>
    </div>
    <p class="sub" style="text-align:center">운영 서버 계정과는 별개입니다 (.env ADMIN_ID/PW)</p>
  </div>
</main>
<script src="/static/js/api.js"></script>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    await post('/api/login', { id: document.getElementById('id').value,
                               pw: document.getElementById('pw').value });
    location.href = '/';
  } catch (err) { msg.textContent = err.message; }
};
</script>
</body>
</html>
